[project]
name = "hermes-life-admin"
version = "0.1.0"
description = "Personal Telegram logger for append-only daily life logs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mistralai>=1.5.0",
    "python-dotenv>=1.0.1",
    "python-telegram-bot[job-queue]>=21.10",
]

[project.scripts]
hermes-life-admin = "hermes_life_admin.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_life_admin"]
